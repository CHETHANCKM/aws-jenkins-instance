name: Deploy Jenkins Infra

on:
  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - name: Configure AWS via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::437563065463:role/github-automation-policy
        aws-region: ap-south-1

    - name: Deploy S3
      run: |
        aws cloudformation deploy \
        --stack-name jenkins-s3 \
        --template-file templates/s3.yaml \
        --parameter-overrides file://params/base-params.json
